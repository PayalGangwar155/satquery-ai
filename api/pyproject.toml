[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "satquery-api"
version = "0.1.0"
description = "SatQuery AI API - Vision-Language Assistant for Remote Sensing & Satellite Data"
authors = [{ name = "SatQuery Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "rasterio>=1.3.9",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "geopandas>=0.14.3",
    "rio-tiler>=6.4.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "python-dotenv>=1.0.1",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "pytest-asyncio"
]
